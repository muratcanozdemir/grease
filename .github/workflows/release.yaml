# Release — runs when a version tag (v*) is pushed.
#
# Produces the full release artifact set and attaches it to a GitHub Release:
#   - cross-compiled binaries for the five supported targets, version-stamped
#   - a SHA-256 checksums file covering every binary
#   - a CycloneDX SBOM generated from the Go module graph
#
# The binaries are pure-Go (CGO_ENABLED=0), built with -trimpath for
# reproducible paths and ldflags stamping version/commit/date into the
# buildinfo package so each binary can report its own provenance via -version.
#
# Token scope: the build and SBOM jobs run read-only. Only the final publish job
# is granted contents:write, and only for the moment it needs to create the
# Release. This keeps the blast radius of any single step minimal.
#
# Action pins: full commit SHAs, not tags. See ci.yml for the rationale and
# scripts/pin-actions.sh to refresh them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  BINARY: grease

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pkg="github.com/user/grease/internal/buildinfo"
          ldflags="-s -w \
            -X ${pkg}.Version=${version} \
            -X ${pkg}.Commit=${commit} \
            -X ${pkg}.Date=${date}"
          out="${BINARY}-${version}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          echo "building ${out}"
          go build -trimpath -ldflags "${ldflags}" -o "dist/${out}" ./cmd/grease
          # Per-binary checksum, computed here where the bytes are produced.
          ( cd dist && sha256sum "${out}" > "${out}.sha256" )

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.BINARY }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  sbom:
    name: generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Generate CycloneDX SBOM
        # cyclonedx-gomod reads the Go module graph directly rather than
        # scanning a filesystem, so the SBOM precisely reflects the module set
        # the binary is built from — the correct tool for a pure-Go repo. The
        # whole-module ("mod") mode with -licenses records dependency licenses.
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -licenses -json -output "${BINARY}-sbom.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: ${{ env.BINARY }}-sbom.cdx.json
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    # Only this job touches the Release, so only this job gets write.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten artifacts into a release directory
        run: |
          mkdir -p release
          # Binaries and their per-file checksums live under per-target dirs;
          # the SBOM under sbom/. Collect them all into one flat directory.
          find artifacts -type f \( -name "${BINARY}-*" -o -name "*.cdx.json" \) -exec cp {} release/ \;
          # Aggregate the individual .sha256 files into one combined manifest,
          # then drop the per-file ones to keep the release listing clean.
          ( cd release && cat *.sha256 > SHA256SUMS && rm -f *.sha256 )
          echo "release contents:"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: |
            release/*
          generate_release_notes: true
          fail_on_unmatched_files: true