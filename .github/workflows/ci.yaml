# CI — runs on every push and pull request.
#
# Gates the codebase on the full local quality bar: format, vet, race-tested
# units, static analysis, and a vulnerability scan of the module graph. Nothing
# here needs secrets or network beyond fetching modules, so the token is
# read-only and no credentials are exposed.
#
# Action pins: every third-party action is pinned to a full commit SHA, not a
# floating tag. A tag can be silently repointed at malicious code by an attacker
# who compromises the upstream repo (this is precisely how the tj-actions and
# codfish/semantic-release-action supply-chain attacks worked). A SHA cannot.
# The trailing comment records which version each SHA corresponds to; refresh
# them with `make pin-actions` (see scripts/pin-actions.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no permissions by default; this workflow only needs to read
# the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Go version across jobs.
  GO_VERSION: "1.26.4"

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify modules are tidy
        run: |
          go mod download
          go mod verify

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  audit:
    name: static analysis · vuln scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...